name: Tukang Commit

on:
  push:
    branches:
      - master

  schedule:
    # Menit 23, sekali sejam. Menit 0 dan 30 adalah slot tersibuk di
    # scheduler GitHub Actions, dan run yang mengantre di situ sering dibuang.
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: tukang-commit
  cancel-in-progress: false

jobs:
  auto-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Run Bot Task
        env:
          COMMITS_PER_HOUR: "5"
          MAX_COMMITS: "30"
        run: |
          chmod +x ./task.sh
          ./task.sh

      - name: Push commits
        run: |
          git push origin HEAD:master || {
            git pull --rebase --strategy-option=theirs origin master
            git push origin HEAD:master
          }
